[package]
name = "auto-server"
version = "0.4.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
hickory-resolver = { version = "0.24", features = ["tokio-runtime", "system-config"] }
tokio = { version = "1.48", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
flate2 = "1.0"
tar = "0.4"
tempfile = "3.10"

# HTTP/3 MASQUE (RFC 9298 CONNECT-UDP) support.
# NOTE: the rustls crypto provider MUST match the one reqwest already pulls in
# (ring — see `cargo tree -e features -i rustls`). Using rustls-aws-lc-rs here
# would compile a second provider, which rustls 0.23 forbids at install time.
quinn = { version = "0.11", default-features = false, features = ["rustls-ring", "runtime-tokio", "log", "platform-verifier", "bloom"] }
h3 = "0.0.8"
h3-quinn = { version = "0.0.10", features = ["datagram"] }
h3-datagram = "0.0.2"
rustls = "0.23"
rustls-pemfile = "2"
bytes = "1"
# MUST be "1" so it unifies with h3's http 1.x; otherwise send_response type
# mismatches at compile time.
http = "1"
# Percent-decoding the RFC 9298 `{target_host}` path segment (`%3A` -> `:`).
percent-encoding = "2"

# Decoding the Proxy-Authorization: Basic challenge for CONNECT-UDP.
base64 = "0.22"

# Parsing the `--ip-pool` CIDR for CONNECT-IP address allocation.
ipnet = "2"

# Raw `TUNSETIFF` ioctl for the CONNECT-IP layer-3 `tun` device. Already a
# transitive dependency of the QUIC stack; listed explicitly because we use it
# directly. musl-safe (raw ioctls are arch-independent on Linux).
libc = "0.2"

# Local patch: accept arbitrary extended-CONNECT `:protocol` values
# (`connect-ip`, `websocket`, ...) in h3 0.0.8. Upstream `Protocol::from_str`
# only accepts `webtransport`/`connect-udp` and rejects everything else with
# H3_MESSAGE_ERROR. See `vendor/h3-patched/src/ext.rs`. NOT shippable as-is —
# a release must host this on a fork repo and switch to `git = "..."`.
[patch.crates-io]
h3 = { path = "vendor/h3-patched" }

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
